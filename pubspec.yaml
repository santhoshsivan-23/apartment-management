name: apartment_management
description: Fully offline Apartment / Community Management System (SQLite-backed)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ---- Offline data layer ----
  sqflite: ^2.3.3+1        # Local SQLite database (fully offline)
  path: ^1.9.0
  path_provider: ^2.1.3    # Locate app documents dir for db + backups + documents

  # ---- Local-only auth / prefs ----
  shared_preferences: ^2.2.3
  crypto: ^3.0.3            # Hash PIN before storing locally

  # ---- Utilities ----
  intl: ^0.19.0              # Date / currency formatting
  uuid: ^4.4.0

  # ---- PDF bills / reports (generated + saved locally, no network) ----
  pdf: ^3.11.0
  printing: ^5.13.1

  # ---- Local file backup / restore (no cloud) ----
  file_picker: ^8.0.6
  share_plus: ^9.0.0

  # ---- Charts for offline reports ----
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3   # lets sqflite run under `flutter test` (desktop test runner)

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/documents/
